    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

            // Unselected & Neutral -> Fade out
            btn.className = "w-full text-left p-3.5 sm:p-4 rounded-xl border border-slate-200 bg-slate-50/30 opacity-60 flex items-start space-x-3";
            label.className = "flex-shrink-0 w-7 h-7 rounded-lg border border-slate-200 bg-white text-slate-400 font-semibold text-xs flex items-center justify-center";
          }
        });

        // Show status badge
        statusBadge.classList.remove('hidden');
        if (selectedOptIdx === undefined) {
          statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700";
          statusBadge.innerText = "Bỏ trống";
        } else if (q.options[selectedOptIdx].correct) {
          statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700";
          statusBadge.innerText = "Chính xác ✓";
        } else {
          statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700";
          statusBadge.innerText = "Chưa đúng ✗";
        }

        // Show explanation box
        expBox.classList.remove('hidden');
      });

      // Show Score Summary Banner
      const scoreScale10 = ((correctCount / totalCount) * 10).toFixed(1);
      document.getElementById('score-text').innerText = `${scoreScale10}`;
      document.getElementById('correct-count').innerText = correctCount;
      document.getElementById('total-count').innerText = totalCount;

      const resultTitle = document.getElementById('result-title');
      const scoreBadge = document.getElementById('score-badge');

      if (scoreScale10 >= 8.0) {
        resultTitle.innerText = "Xuất sắc! 🎉";
        scoreBadge.className = "inline-flex items-center justify-center w-24 h-24 rounded-full bg-emerald-50 text-emerald-600 mb-4 border-4 border-emerald-100";
      } else if (scoreScale10 >= 6.5) {
        resultTitle.innerText = "Kết quả khá tốt! 👍";
        scoreBadge.className = "inline-flex items-center justify-center w-24 h-24 rounded-full bg-brand-50 text-brand-600 mb-4 border-4 border-brand-100";
      } else if (scoreScale10 >= 5.0) {
        resultTitle.innerText = "Đạt yêu cầu! Cố gắng thêm nhé! 💪";
        scoreBadge.className = "inline-flex items-center justify-center w-24 h-24 rounded-full bg-amber-50 text-amber-600 mb-4 border-4 border-amber-100";
      } else {
        resultTitle.innerText = "Cần ôn tập kỹ hơn nữa! 📚";
        scoreBadge.className = "inline-flex items-center justify-center w-24 h-24 rounded-full bg-rose-50 text-rose-600 mb-4 border-4 border-rose-100";
      }

      document.getElementById('result-card').classList.remove('hidden');

      // Smooth scroll to top to see score
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Scroll to review questions
    function scrollToReview() {
      const container = document.getElementById('quiz-container');
      container.scrollIntoView({ behavior: 'smooth' });
    }

    // Restart Exam
    function restartExam() {
      initExam();
    }

    // Initialize on load
    window.onload = function() {
      initExam();
    };
  </script>
</body>
</html>
